<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Proyecto Cryptos</title>
    <style>
      body{font-family:system-ui, Arial, sans-serif; max-width:900px; margin:40px auto; padding:0 16px;}
      h1{text-align:center; margin-bottom:8px;}
      h2{margin-top:28px;}
      /* Lista en columnas (se adapta bien en desktop) */
      .crypto-list{columns:2; gap:2rem; padding-left:1.2rem; list-style:square;}
      @media (max-width:640px){ .crypto-list{columns:1;} }
      /* Imagen con pie (por si querés usarlo) */
      figure{margin:24px 0; text-align:center;}
      figure img{max-width:100%; height:auto;}
      figure figcaption{font-size:.9rem; color:#555;}
    </style>
  </head>
  <body>
    <h1>TRABAJO PRÁCTICO DE PROGRAMACIÓN</h1>
    <h2>Criptomonedas presentes en el dataset</h2>
    <noscript>Esta lista requiere JavaScript habilitado.</noscript>
    <ul id="lista-criptos" class="crypto-list"></ul>

    <script>
      // Si el CSV está en otra carpeta, cambiá la ruta acá:
      fetch('criptomonedas_unicas.csv')
        .then(r => r.text())
        .then(txt => {
          // Divide por líneas y maneja encabezado "Name"
          const lines = txt.trim().split(/\r?\n/);
          const start = lines[0].toLowerCase().includes('name') ? 1 : 0;

          // Toma la primera columna por si vinieran más columnas
          const names = lines
            .slice(start)
            .map(l => l.split(',')[0].trim())
            .filter(Boolean);

          const ul = document.getElementById('lista-criptos');
          names.forEach(n => {
            const li = document.createElement('li');
            li.textContent = n;
            ul.appendChild(li);
          });
        })
        .catch(err => {
          document.getElementById('lista-criptos').innerHTML =
            '<li>No pude cargar el CSV (revisá la ruta/nombre de archivo).</li>';
          console.error(err);
        });
    </script>

    <!-- Ejemplo de imagen con pie de imagen -->

      <figcaption>Marketcap histórico de Bitcoin (2014–2022).</figcaption>
    </figure>
    -->
  </body>
</html>
