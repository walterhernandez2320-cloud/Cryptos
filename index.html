


<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Proyecto Cryptos — Gráficos de Marketcap</title>

  <style>
    body { 
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #121212; 
      color: #f5f5f5;
    }

    .contenedor { 
      max-width: 900px; 
      margin: 0 auto; 
      text-align: center;
    }

    h1 { 
      color: #00ffc8; 
      margin-bottom: 16px;
    }

    select { 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: none; 
      background-color: #1f1f1f; 
      color: #00ffc8; 
      font-size: 16px; 
      margin-top: 10px;
    }

    #grafico { 
      display: none; 
      max-width: 100%; 
      height: auto; 
      margin: 30px auto; 
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 255, 200, 0.3);
    }

    .hint { 
      color: #aaa; 
      font-size: 0.9em; 
    }

    /* Texto de historia */
    .historia {
      display: none;
      text-align: left;
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      margin: 16px auto 0;
      max-width: 900px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    /* Estadísticas */
    .stats {
      display: none;
      text-align: left;
      background: #171717;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      margin: 12px auto 0;
      max-width: 900px;
      white-space: normal;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <h1>Analisis historico de criptomonedas</h1>

    <p>Elegí una criptomoneda:</p>

    <select id="crypto">
      <option value="">-- Seleccionar --</option>
      <option>Aave</option>
      <option>Binance Coin</option>
      <option>Bitcoin</option>
      <option>Cardano</option>
      <option>Chainlink</option>
      <option>Cosmos</option>
      <option>Crypto.com Coin</option>
      <option>Dogecoin</option>
      <option>Eos</option>
      <option>Ethereum</option>
      <option>IOTA</option>
      <option>LiteCoin</option>
      <option>Monero</option>
      <option>NEM</option>
      <option>Polkadot</option>
      <option>Solana</option>
      <option>Stellar</option>
      <option>TRON</option>
      <option>Tether</option>
      <option>USD Coin</option>
      <option>Uniswap</option>
      <option>Wrapped Bitcoin</option>
      <option>XRP</option>
    </select>

    <img id="grafico" alt="Gráfico de la cripto seleccionada" />
    <div id="historia" class="historia"></div>

    <!-- Contenedor para ESTADÍSTICAS (CSV) -->
    <div id="stats" class="stats"></div>
  </div>

  <script>
    // Nombre de imagen: plots/Marketcap_<Nombre_con_guion_bajo>.png
    function nombreAArchivo(nombre) {
      return "plots/Marketcap_" + nombre.replace(/\s+/g, "_") + ".png";
    }

    // Slug base para historias (mantiene mayúsculas/minúsculas)
    function toSlugBase(nombre) {
      return nombre.trim().replace(/\s+/g, "_"); // "Crypto.com Coin" → "Crypto_com_Coin"
    }

    function rutaTexto(nombre) {
      return "textos/" + toSlugBase(nombre) + ".txt";
    }

    // ---- CSV de estadísticas ----
    // Slug para CSV: minúsculas, sin acentos, espacios/puntos → _
    function toSlugCsv(nombre) {
      return nombre
        .replace(/\s+/g, '_')                           // solo los espacios 
    }

    // Ruta CSV: csv/estadisticas_<slug>.csv
    function rutaStats(nombre) {
      return "csv/estadisticas_" + toSlugCsv(nombre) + ".csv";
    }

    const select = document.getElementById("crypto");
    const img = document.getElementById("grafico");
    const historiaBox = document.getElementById("historia");
    const statsBox = document.getElementById("stats");

    async function cargarHistoria(nombre) {
      const url = rutaTexto(nombre) + "?v=" + Date.now();
      historiaBox.style.display = "block";
      historiaBox.textContent = "Cargando historia de " + nombre + "…";
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("No se encontró " + url);
        const texto = await resp.text();
        historiaBox.textContent = texto.trim() ? texto : "Sin contenido disponible.";
      } catch (e) {
        historiaBox.style.display = "none";
        alert("No encontré el archivo de historia:\n" + url + "\nCreá " + toSlugBase(nombre) + ".txt en /textos");
      }
    }

    // Convierte CSV → tabla HTML (detecta ; o , como separador)
    function csvToTable(csvText) {
      const raw = csvText.trim();
      if (!raw) return "<em>Sin datos</em>";

      const lines = raw.split(/\r?\n/);
      const guessDelim = (line) => {
        const c = (line.match(/,/g) || []).length;
        const s = (line.match(/;/g) || []).length;
        return s > c ? ';' : ',';
      };
      const delim = guessDelim(lines[0]);

      const rows = lines.map(line => line.split(delim));
      let html = `
        <table style="width:100%; border-collapse:collapse; background:#1b1b1b; border:1px solid #2a2a2a; border-radius:10px; overflow:hidden;">
          <thead>
            <tr>
              ${rows[0].map(h => `<th style="border-bottom:1px solid #2a2a2a; padding:8px 10px; text-align:left; color:#00ffc8;">${h}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${rows.slice(1).map(r => `
              <tr>
                ${r.map(c => `<td style="border-top:1px solid #2a2a2a; padding:8px 10px;">${c}</td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      return html;
    }

    // Cargar estadísticas desde CSV y renderizar tabla
    async function cargarStats(nombre) {
      const url = rutaStats(nombre) + "?v=" + Date.now(); // evita caché
      statsBox.style.display = "block";
      statsBox.textContent = "Cargando estadísticas de " + nombre + "…";
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("No se encontró " + url);
        const csv = await resp.text();
        statsBox.innerHTML = csvToTable(csv);
      } catch (e) {
        statsBox.style.display = "none";
        alert(
          "No encontré el archivo de estadísticas (CSV):\n" +
          url + 
          "\nVerificá el nombre y la carpeta. Debe estar en /csv y llamarse:\n" +
          "estadisticas_" + toSlugCsv(nombre) + ".csv"
        );
      }
    }

    select.addEventListener("change", () => {
      const nombre = select.value;

      if (!nombre) {
        img.style.display = "none";
        img.src = "";
        historiaBox.style.display = "none";
        historiaBox.textContent = "";
        statsBox.style.display = "none";
        statsBox.textContent = "";
        return;
      }

      const ruta = nombreAArchivo(nombre);
      img.onerror = () => {
        img.style.display = "none";
        alert("No encontré la imagen: " + ruta + "\nVerificá el nombre del archivo en la carpeta plots/");
      };

      img.onload = () => {
        img.style.display = "block";
      };

      img.src = ruta + "?v=" + Date.now();
      img.alt = "Marketcap — " + nombre;

      // Cargar historia y estadísticas
      cargarHistoria(nombre);
      cargarStats(nombre);
    });
  </script>
</body>
</html>
