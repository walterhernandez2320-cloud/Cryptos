<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Proyecto Cryptos — Gráficos por selección</title>

  <style>
    body { 
      font-family: system-ui, Arial, sans-serif; 
      margin: 0; 
      padding: 24px; 
      background-color: #121212; /* Fondo oscuro */
      color: #f5f5f5; /* Texto claro */
    }

    .contenedor { 
      max-width: 900px; 
      margin: 0 auto; 
    }

    h1 { 
      text-align: center; 
      margin-bottom: 16px; 
      color: #00ffc8; /* Color tipo "neón" crypto */
    }

    .panel { 
      display: flex; 
      gap: 12px; 
      align-items: center; 
      justify-content: center; 
      flex-wrap: wrap; 
    }

    select { 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: none; 
      background-color: #1f1f1f; 
      color: #00ffc8; 
      font-size: 16px; 
    }

    #grafico { 
      display: block; 
      max-width: 100%; 
      height: auto; 
      margin: 24px auto; 
      border-radius: 12px; 
      box-shadow: 0 0 12px rgba(0, 255, 200, 0.3);
    }

    .hint { 
      text-align: center; 
      color: #aaa; 
    }
  </style>
</head>
