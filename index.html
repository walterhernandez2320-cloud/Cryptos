<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Proyecto Cryptos — Gráficos de Marketcap</title>

  <style>
    body { 
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #121212; 
      color: #f5f5f5;
    }

    .contenedor { 
      max-width: 900px; 
      margin: 0 auto; 
      text-align: center;
    }

    h1 { 
      color: #00ffc8; 
      margin-bottom: 16px;
    }

    select { 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: none; 
      background-color: #1f1f1f; 
      color: #00ffc8; 
      font-size: 16px; 
      margin-top: 10px;
    }

    #grafico { 
      display: none; 
      max-width: 100%; 
      height: auto; 
      margin: 30px auto; 
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 255, 200, 0.3);
    }

    .hint { 
      color: #aaa; 
      font-size: 0.9em; 
    }

    /* 1️⃣ ESTILO PARA EL TEXTO DE HISTORIA */
    .historia {
      display: none;
      text-align: left;
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      margin: 16px auto 0;
      max-width: 900px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    /* 2️⃣ NUEVO: ESTILO PARA ESTADÍSTICAS */
    .stats {
      display: none;
      text-align: left;
      background: #171717;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      margin: 12px auto 0;
      max-width: 900px;
      white-space: pre-wrap;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <h1>TRABAJO PRÁCTICO DE PROGRAMACIÓN</h1>

    <p>Elegí una criptomoneda para ver su gráfico:</p>

    <select id="crypto">
      <option value="">-- Seleccionar --</option>
      <option>Aave</option>
      <option>Binance Coin</option>
      <option>Bitcoin</option>
      <option>Cardano</option>
      <option>Chainlink</option>
      <option>Cosmos</option>
      <option>Crypto.com Coin</option>
      <option>Dogecoin</option>
      <option>Eos</option>
      <option>Ethereum</option>
      <option>IOTA</option>
      <option>LiteCoin</option>
      <option>Monero</option>
      <option>NEM</option>
      <option>Polkadot</option>
      <option>Solana</option>
      <option>Stellar</option>
      <option>TRON</option>
      <option>Tether</option>
      <option>USD Coin</option>
      <option>Uniswap</option>
      <option>Wrapped Bitcoin</option>
      <option>XRP</option>
    </select>


    <img id="grafico" alt="Gráfico de la cripto seleccionada" />
    <div id="historia" class="historia"></div>

    <!-- 3️⃣ NUEVO: CONTENEDOR PARA ESTADÍSTICAS -->
    <div id="stats" class="stats"></div>
  </div>

  <script>
    // Función para convertir el nombre seleccionado en nombre de archivo de imagen
    function nombreAArchivo(nombre) {
      // Reemplaza espacios por guiones bajos: "Binance Coin" → "Binance_Coin"
      return "plots/Marketcap_" + nombre.replace(/\s+/g, "_") + ".png";
    }

    /* 4️⃣ FUNCIONES PARA CARGAR .TXT DE HISTORIA */
    function toSlugBase(nombre) {
      return nombre.trim().replace(/[\s.]+/g, "_"); // "Crypto.com Coin" → "Crypto_com_Coin"
    }
    function rutaTexto(nombre) {
      return "textos/" + toSlugBase(nombre) + ".txt";
    }

    // 5️⃣ NUEVO: RUTA Y CARGA DE ESTADÍSTICAS (TXT)
      function rutaStats(nombre) {
        // Ej: "Bitcoin" → text/stats_Bitcoin.csv
        return "csv/stats_" + toSlugBase(nombre) + ".csv";
      }

    const select = document.getElementById("crypto");
    const img = document.getElementById("grafico");
    const historiaBox = document.getElementById("historia");
    const statsBox = document.getElementById("stats");

    async function cargarHistoria(nombre) {
      const url = rutaTexto(nombre) + "?v=" + Date.now(); // evita caché
      historiaBox.style.display = "block";
      historiaBox.textContent = "Cargando historia de " + nombre + "…";
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("No se encontró " + url);
        const texto = await resp.text();
        historiaBox.textContent = texto.trim() ? texto : "Sin contenido disponible.";
      } catch (e) {
        historiaBox.style.display = "none";
        alert("No encontré el archivo de historia:\n" + url + "\nCreá " + toSlugBase(nombre) + ".txt en /textos");
      }
    }

    // 6️⃣ NUEVO: CARGAR ESTADÍSTICAS
// 6️⃣ NUEVO: CARGAR ESTADÍSTICAS DESDE CSV Y RENDERIZAR TABLA
    async function cargarStats(nombre) {
      const url = rutaStats(nombre) + "?v=" + Date.now(); // evita caché
      statsBox.style.display = "block";
      statsBox.textContent = "Cargando estadísticas de " + nombre + "…";
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("No se encontró " + url);
        const csv = await resp.text();
        statsBox.innerHTML = csvToTable(csv); // ← pintamos una tabla HTML
      } catch (e) {
        statsBox.style.display = "none";
        alert(
          "No encontré el archivo de estadísticas (CSV):\n" +
          url + 
          "\nSi ya lo generaste, verificá el nombre. Debe estar en /text y llamarse stats_" + toSlugBase(nombre) + ".csv"
        );
      }
    }

    select.addEventListener("change", () => {
      const nombre = select.value;

      if (!nombre) {
        img.style.display = "none";
        img.src = "";
        historiaBox.style.display = "none";
        historiaBox.textContent = "";
        // 7️⃣ NUEVO: reset stats
        statsBox.style.display = "none";
        statsBox.textContent = "";
        return;
      }

      const ruta = nombreAArchivo(nombre);
      img.onerror = () => {
        img.style.display = "none";
        alert("No encontré la imagen: " + ruta + "\nVerificá el nombre del archivo en la carpeta plots/");
      };

      img.onload = () => {
        img.style.display = "block";
      };

      img.src = ruta + "?v=" + Date.now(); // evita problemas de caché
      img.alt = "Marketcap — " + nombre;

      // Cargar historia y estadísticas para la cripto seleccionada
      cargarHistoria(nombre);
      cargarStats(nombre);
    });
  </script>
</body>
</html>
